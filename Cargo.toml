[package]
name = "fancy-window"
version = "2.0.0"
edition = "2024"
description = "A tiny tiling host for Windows: drop windows into resizable zones."
license = "MIT"
authors = ["Nicholas Thomas"]
repository = "https://github.com/DevNickThomas/FancyWindow"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_Graphics_Dwm", "Win32_System_SystemServices", "Win32_UI_Controls", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_SystemInformation"] }
